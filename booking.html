        <h1 style="margin: 1%; color: #000000c1;">Book Your Appointment</h1>
        <p style="margin: 2%; color: #000000d2;">Please fill in your details below</p>

    <div id="form" align="center">   
        <form method="GET" action="https://www.ahlia.edu.bh/">

                <label for="fullName" id="book">
                    <img width="15" height="15" src="https://img.icons8.com/material-outlined/24/name.png" alt="name"/> 
                    Full Name: 
                </label> 
                        <input 
                            type="text"
                            id="fullName"
                            name="fullName"
                            placeholder="e.g. Name"
                            required                  
                        >      

            <br>
            <br>

                <label for="poneNumber" id="book">
                    <img width="15" height="15" src="https://img.icons8.com/material-outlined/24/phone.png" alt="phone"/> 
                        Phone Number: 
                </label>

                        <input 
                            type="tel"
                            id="poneNumber"
                            name="poneNumber"
                            placeholder="+973 xxxxxxxx " 
                            required
                        >

            <br>
            <br>
            
                <label for="email" id="book">
                    <img width="15" height="15" src="https://img.icons8.com/material-outlined/24/mail.png" alt="mail"/>
                    Email:
                </label>
                        <input 
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Your Email @gmail.com"
                            required
                        >
                    
            <br>
            <br>
            
                <label for="path" id="book">Choose the Services</label>
                    <select name="path" id="path">
                        <option value="general">General</option>
                        <option value="ear_throat">Ear, Nose & Throat (ENT)</option>
                        <option value="cardiology">Cardiology</option>
                        <option value="dermatology">Dermatology</option>
                        <option value="orthopedic">Orthopedic</option>
                        <option value="neurology">Neurology</option>
                    </select>

            <br>
            <br>

                    <label for="age" id="book"> Age:</label>
                        <input 
                            type="number"
                            id="age"
                            name="age"
                            placeholder="Your Age"
                            required
                        >
                            
            <br>

                <p>
                    <label for="date" id="book">Appointment Date:</label>
                        <input type="date" name="date" id="date" min="2026-01-01"">        
                            <input type="time" id="time" name="time" required>
                </p>

                    <label for="doctor" id="book">Choose Your Doctor:-</label>
                        <select name="doctor" id="doctor">
                            <option value="anyone">Anyone</option>
                            <option value="ali">Dr.Ali Jaafar</option>
                            <option value="sara">Dr.Sara Muhammad</option>
                            <option value="fatama">Dr.Fatama Jamal </option>
                            <option value="hasan">Dr.Hasan Ali</option>
                            <option value="jassim">Dr.Jassim Habib </option>
                            <option value="aasser">Dr.Nasser Younis</option>                           
                        </select>

            <br>
            <br>


                            <p class="gender-option">
                                <input type="radio" name="gender" id="male" value="male">
                                <label for="male">Male</label>
                            </p>

                        <img width="50" height="50" src="https://img.icons8.com/cotton/64/gender.png" alt="gender"/>

                            <p class="gender-option">
                                <input type="radio" name="gender" id="female" value="female">
                                <label for="female">Female</label>
                            </p>
                    
                    
                    
            <br>

                <label for="notes" id="book">
                    <img width="20" height="20" src="https://img.icons8.com/sf-regular/48/create-new.png" alt="create-new"/>
                    Notes:
                </label>
                        <textarea 
                            id="notes"
                            name="notes"
                            placeholder="Write your notes....."
                        ></textarea>                  

                     <br>
                     <br>

            <button type="submit"><strong>Booking</strong></button>
            <button type="reset" id="clear">Clear <strong>X</strong> </button>
      </form>
